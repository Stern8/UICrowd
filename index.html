<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UICrowd</title>
<meta name="description" content="Dynamic use of HTML in canvas and audio to generate unique results.">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>

<!-- Pinned scroll stage: scroll progress drives the camera dive + video scrub -->
<main id="stage">
  <div class="pin">
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- Real text for screen readers / SEO. The visible hero type is painted into the canvas
         so the tiles can slice and warp it. -->
    <h1 class="sr-only">UICrowd</h1>
    <p class="sr-only">Dynamic use of HTML in canvas and audio to generate unique results.</p>

    <div class="chrome" id="chrome">
      <a class="corner tl" href="#">Playground</a>
      <span class="corner tr"><i class="dot"></i>UICrowd · v0.1</span>
      <a class="cta" id="cta" href="#next">Enter <span aria-hidden="true">↗</span></a>
      <span class="meta" id="meta">Three.js · html-in-canvas</span>
      <span class="corner bl">Built on the open web</span>
      <span class="corner br">Docs · Changelog</span>
      <span class="scroll-hint" id="hint">Scroll</span>
    </div>
  </div>
</main>

<section id="next" class="after">
  <p class="eyebrow">Next section</p>
  <h2>You're through the tile.</h2>
  <p>Replace this block with the rest of the site.</p>
</section>

<script type="module" src="main.js"></script>
<noscript><style>.pin{background:#d4d9da}</style></noscript>
</body>
</html>
